name: Publish NouGenTracker dashboard to Hugging Face

# Publishes the real fleet dashboard to a free STATIC Hugging Face Space. The
# old job mirrored the whole repository and generated an index of filenames,
# which made the Space look like a file browser instead of a tracker. Build a
# small staging directory containing only the rendered dashboard and its
# provenance, then replace the Space contents through the HTTP API.
#
# One-time setup (repo Settings):
#   - Secret  HF_TOKEN: Hugging Face token with write access to the Space
#   - Variable HF_SPACE: the Space id, e.g. "nougenai/NouGenTracker-node"
# Until both are configured the job skips gracefully.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload snapshot to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          DASHBOARD_DAYS: ${{ vars.DASHBOARD_DAYS || '3650' }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret and/or HF_SPACE variable not set - skipping Space sync."
            exit 0
          fi
          rm -rf hf-space
          mkdir -p hf-space
          # Static SDK reads its config from README front-matter. Keep the
          # repository README out of the Space so the landing page is the
          # rendered tracker, not a source-file listing.
          TITLE="$(basename "$HF_SPACE")"
          {
            printf -- '---\ntitle: %s\nemoji: 📈\ncolorFrom: gray\ncolorTo: blue\nsdk: static\npinned: false\n---\n\n' "$TITLE"
            printf '%s\n' '# NouGenTracker dashboard' \
              'Live fleet usage rollup published from the canonical NouGenTracker dailies.'
          } > hf-space/README.md
          printf '%s\n' "${GITHUB_SHA}" > hf-space/.deploy_sha
          # Render the same dashboard used locally, from the committed dailies.
          python3 fleet_summary.py --days "${DASHBOARD_DAYS:-3650}" \
            --out hf-space/index.html --title "NouGen fleet usage"
          python3 - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "source_commit": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "dashboard": "index.html",
          }
          with open("hf-space/deploy.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
              fh.write("\n")
          PYEOF
          pip install -q "huggingface_hub>=0.24"
          python3 - <<'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="hf-space",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              delete_patterns=["*"],
              commit_message="Space deploy: snapshot of " + os.environ["GITHUB_SHA"],
          )
          print("uploaded snapshot", os.environ["GITHUB_SHA"])
          PYEOF
      - name: Verify dashboard serves the new snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "Secrets not configured - nothing was deployed, skipping verification."
            exit 0
          fi
          HOST="$(echo "$HF_SPACE" | tr '[:upper:]' '[:lower:]' | tr '/_.' '---')"
          URL="https://${HOST}.static.hf.space/.deploy_sha"
          echo "Waiting for ${URL} to report ${GITHUB_SHA}..."
          for i in $(seq 1 30); do
            body=$(curl -sS -m 15 -H "Authorization: Bearer ${HF_TOKEN}" "$URL" 2>/dev/null || true)
            if [ "$(echo "$body" | tr -d '[:space:]')" = "${GITHUB_SHA}" ]; then
              DASHBOARD_URL="https://${HOST}.static.hf.space/index.html"
              dashboard=$(curl -sS -m 15 "$DASHBOARD_URL" 2>/dev/null || true)
              if echo "$dashboard" | grep -q "NouGen fleet usage" && ! echo "$dashboard" | grep -q "index.json"; then
                echo "Dashboard is serving the new deploy."
                exit 0
              fi
              echo "Dashboard body is not live yet; retrying."
            fi
            sleep 10
          done
          echo "::error::Mirror did not serve the new deploy sha within 5 minutes. Last: ${body:-<none>}"
          exit 1
