name: Sync to Hugging Face Space

# Mirrors main to a free STATIC Hugging Face Space so the fleet can read this
# repo's records over HTTPS 24/7 without git credentials. Pattern lifted from
# NouGenShards' deploy-space.yml (orphan snapshot + LFS guard + boot verify),
# adapted for the static SDK: no server, files served as-is, so the workflow
# injects README front-matter and generates index.html + index.json.
#
# One-time setup (repo Settings):
#   - Secret  HF_TOKEN: Hugging Face token with write access to the Space
#   - Variable HF_SPACE: the Space id, e.g. "nougenai/NouGenTracker-node"
# Until both are configured the job skips gracefully.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Push snapshot to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret and/or HF_SPACE variable not set - skipping Space sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git checkout --orphan hf-deploy
          cat >> .gitattributes <<'EOF'
          *.png filter=lfs diff=lfs merge=lfs -text
          *.jpg filter=lfs diff=lfs merge=lfs -text
          *.jpeg filter=lfs diff=lfs merge=lfs -text
          *.gif filter=lfs diff=lfs merge=lfs -text
          *.ico filter=lfs diff=lfs merge=lfs -text
          *.webp filter=lfs diff=lfs merge=lfs -text
          EOF
          echo "${GITHUB_SHA}" > .deploy_sha
          # Static SDK reads its config from README front-matter; the repo's own
          # README doesn't carry it, so prepend it in the snapshot only.
          TITLE="$(basename "$HF_SPACE")"
          { printf -- '---\ntitle: %s\nemoji: 🛰️\ncolorFrom: gray\ncolorTo: blue\nsdk: static\npinned: false\n---\n\n' "$TITLE"; cat README.md 2>/dev/null; } > README.hf.md
          mv README.hf.md README.md
          # Machine-readable manifest + minimal human index of every served file.
          python3 - <<'PYEOF'
          import json, os, subprocess
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          files = [f for f in files if not f.startswith(".git")]
          sha = open(".deploy_sha").read().strip()
          json.dump({"deploy_sha": sha, "files": files}, open("index.json", "w"), indent=1)
          rows = "\n".join('<li><a href="%s">%s</a></li>' % (f, f) for f in sorted(files))
          open("index.html", "w").write(
              "<!doctype html><title>%s</title><h1>%s</h1><p>deploy %s</p>"
              "<p><a href='index.json'>index.json</a></p><ul>%s</ul>"
              % (os.environ.get("HF_SPACE", "mirror"), os.environ.get("HF_SPACE", "mirror"), sha[:12], rows))
          PYEOF
          git rm -r --cached -q -f .
          git add -A
          git commit -qm "Space deploy: snapshot of ${GITHUB_SHA}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
      - name: Verify mirror serves the new snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "Secrets not configured - nothing was deployed, skipping verification."
            exit 0
          fi
          HOST="$(echo "$HF_SPACE" | tr '[:upper:]' '[:lower:]' | tr '/_.' '---')"
          URL="https://${HOST}.static.hf.space/.deploy_sha"
          echo "Waiting for ${URL} to report ${GITHUB_SHA}..."
          for i in $(seq 1 30); do
            body=$(curl -sS -m 15 -H "Authorization: Bearer ${HF_TOKEN}" "$URL" 2>/dev/null || true)
            if [ "$(echo "$body" | tr -d '[:space:]')" = "${GITHUB_SHA}" ]; then
              echo "Mirror is serving the new snapshot."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Mirror did not serve the new deploy sha within 5 minutes. Last: ${body:-<none>}"
          exit 1
